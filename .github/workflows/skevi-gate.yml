# Gate autoritativo de Skevi (ADR-034). El hook local scripts/hooks/pre-push
# corre check_sizes, check_plans, check_reports y unittest como verificación
# rápida; el espejo de digests de .skevi/ también lo cubre unittest. Las tres
# invocaciones de check_templates (HG-4) viven aquí: su señal es el drift de
# VERSIÓN (breaking y cadenas), no el contenido — manifiesto contra disco es
# cosa de check_sizes, y digests del registro contra manifiesto, del unittest.
name: skevi-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skevi-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Historia completa: la prueba de procedencia de .skevi/ (HG-4,
          # ADR-031) coteja el source de cada registro contra el último
          # commit que tocó su manifiesto — sin historia sería siempre el
          # commit de checkout, y la propiedad quedaría sin verificar en
          # el runner autoritativo.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Python version
        run: python --version
      - name: check_sizes
        run: python scripts/check_sizes.py
      - name: check_plans
        run: python scripts/check_plans.py
      - name: check_reports
        run: python scripts/check_reports.py
      - name: check_templates (drift de versión; espejo de digests en unittest)
        run: |
          python scripts/check_templates.py --manifest templates/skevi/MANIFEST.json --installed .skevi/installed.json
          python scripts/check_templates.py --manifest scripts/MANIFEST.json --installed .skevi/scripts-installed.json
          python scripts/check_templates.py --manifest docs/MANIFEST.json --installed .skevi/corpus-installed.json
      - name: unittest
        run: python -m unittest discover -s tests
